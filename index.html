<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chris Cell</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111}header{background:#fff;padding:18px;border-bottom:1px solid #ddd;position:sticky;top:0}header b{font-size:24px}main{max-width:1050px;margin:auto;padding:24px 16px}.hero{margin-bottom:20px}.hero h1{font-size:30px;margin:0 0 6px}.hero p{color:#667085}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.controls input,.controls select{padding:12px;border:1px solid #ddd;border-radius:10px;background:#fff}.controls input{flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{background:#fff;border:1px solid #e2e4e8;border-radius:16px;overflow:hidden}.photo{aspect-ratio:1;background:#eee;display:flex;align-items:center;justify-content:center;font-size:48px}.photo img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.ok{color:#16a34a;font-weight:bold;font-size:12px}.name{font-size:19px;font-weight:bold;margin:6px 0}.meta{color:#667085;font-size:13px;line-height:1.5}.price{font-size:22px;font-weight:bold;margin:12px 0}.wa{display:block;background:#111;color:#fff;text-align:center;text-decoration:none;padding:12px;border-radius:10px;font-weight:bold}.empty{text-align:center;padding:50px;color:#667085}
</style><header><b>CHRIS CELL</b></header><main><section class="hero"><h1>Catálogo de aparelhos</h1><p>Aparelhos disponíveis • fotos, detalhes e preço</p></section><div class="controls"><input id="q" placeholder="🔎 Buscar aparelho" oninput="render()"><select id="t" onchange="render()"><option value="">Todos</option><option>iPhone</option><option>Android</option></select></div><section id="grid" class="grid"></section></main><script>
const products=[{name:"iPhone 13",type:"iPhone",storage:"128 GB",color:"Azul",battery:"100%",condition:"Seminovo",price:1800,photo:""}];
function render(){let q=document.getElementById("q").value.toLowerCase(),t=document.getElementById("t").value;let a=products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!t||p.type==t));document.getElementById("grid").innerHTML=a.length?a.map(p=>`<article class="card"><div class="photo">${p.photo?`<img src="${p.photo}">`:"📱"}</div><div class="body"><div class="ok">● DISPONÍVEL</div><div class="name">${p.name}</div><div class="meta">${p.type} • ${p.storage}<br>${p.color} • Bateria ${p.battery}<br>${p.condition}</div><div class="price">R$ ${p.price.toLocaleString("pt-BR")}</div><a class="wa" target="_blank" href="https://wa.me/?text=${encodeURIComponent("Olá! Tenho interesse no "+p.name+" do catálogo Chris Cell.")}">Tenho interesse • WhatsApp</a></div></article>`).join(""):`<div class="empty">Nenhum aparelho encontrado.</div>`}render();
</script></html>
