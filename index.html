<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHRIS CELL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#111}
header{background:#111;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:10}
.header{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-size:24px;font-weight:800}.muted{color:#777}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}.green{background:#16803c;color:#fff}.light{background:#fff;border:1px solid #ddd}.danger{background:#b42318;color:#fff}
main{max-width:1100px;margin:20px auto;padding:0 14px}.panel{background:#fff;border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 2px 12px #0000000d}
h1,h2,h3{margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 12px #0000000d}.card img{width:100%;height:210px;object-fit:cover;background:#eee}.cardbody{padding:14px}
.price{font-size:23px;font-weight:800;margin:8px 0}.badge{display:inline-block;background:#eee;padding:5px 8px;border-radius:999px;font-size:12px;margin:2px}
input,select,textarea{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:15px;background:#fff}
label{font-weight:700;font-size:13px;display:block;margin:10px 0 5px}
.row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.center{text-align:center}
.notice{padding:12px;border-radius:10px;background:#fff8d9;border:1px solid #f0d875}.error{padding:12px;border-radius:10px;background:#ffe7e5;color:#8a1c16}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.tabs button.active{background:#111;color:#fff}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.photos img{width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid #ddd}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{background:#fff;width:min(520px,100%);max-height:90vh;overflow:auto;border-radius:16px;padding:20px}
@media(max-width:650px){.row,.row3{grid-template-columns:1fr}.header{align-items:flex-start}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card img{height:170px}}
</style>
</head>
<body>
<header>
<div class="header">
<div class="logo">CHRIS CELL</div>
<div class="actions">
<button id="loginBtn" class="btn light" onclick="openLogin()">Entrar</button>
<button id="logoutBtn" class="btn light hidden" onclick="logout()">Sair</button>
</div>
</div>
</header>

<main>
<section id="publicSection">
<div class="panel">
<h2 id="catalogTitle">Catálogo</h2>
<div id="sellerInfo" class="muted"></div>
<div class="row">
<div><label>Buscar</label><input id="search" placeholder="Modelo, cor, armazenamento..." oninput="renderCatalog()"></div>
<div><label>Sistema</label><select id="osFilter" onchange="renderCatalog()"><option value="">Todos</option><option value="android">Android</option><option value="iphone">iPhone</option></select></div>
</div>
</div>
<div id="catalog" class="grid"></div>
</section>

<section id="adminSection" class="hidden">
<div class="panel">
<h2>Painel CHRIS CELL</h2>
<div id="userInfo" class="muted"></div>
<div class="tabs">
<button class="btn light active" id="tabProducts" onclick="showTab('products')">Estoque</button>
<button class="btn light" id="tabAdd" onclick="showTab('add')">+ Adicionar aparelho</button>
</div>
<div id="productsTab">
<div id="adminProducts" class="grid"></div>
</div>
<div id="addTab" class="hidden">
<h3>Novo aparelho</h3>
<div class="row">
<div><label>Modelo</label><input id="pModel" placeholder="Ex.: iPhone 11"></div>
<div><label>Sistema</label><select id="pOs"><option value="iphone">iPhone </option><option value="android">Android</option></select></div>
</div>
<div class="row3">
<div><label>Armazenamento</label><input id="pStorage" placeholder="128 GB"></div>
<div><label>Cor</label><input id="pColor" placeholder="Preto"></div>
<div><label>Bateria</label><input id="pBattery" placeholder="87%"></div>
</div>
<div class="row">
<div><label>Condição</label><select id="pCondition"><option>Usado</option><option>Novo</option><option>Recondicionado</option></select></div>
<div><label>Seu preço-base (R$)</label><input id="pBase" type="number" min="0" step="0.01" placeholder="300"></div>
</div>
<label>Descrição</label><textarea id="pDescription" rows="3" placeholder="Observações do aparelho"></textarea>
<label>Fotos (até 10)</label><input id="pPhotos" type="file" accept="image/*" multiple onchange="previewPhotos()">
<div id="photoPreview" class="photos"></div>
<div id="saveMsg"></div>
<br><button class="btn primary" onclick="saveProduct()">Salvar aparelho</button>
</div>
</div>
</section>

<section id="sellerSection" class="hidden">
<div class="panel">
<h2>Meu catálogo de vendas</h2>
<div id="sellerUserInfo" class="muted"></div>
<div class="notice" style="margin-top:12px">
<strong>Seu link:</strong>
<div class="actions" style="margin-top:8px">
<input id="sellerLink" readonly>
<button class="btn primary" onclick="copySellerLink()">Copiar link</button>
</div>
</div>
</div>
<div class="panel">
<h3>Defina o preço de cada aparelho</h3>
<p class="muted">O preço-base da CHRIS CELL é privado. O cliente verá somente o seu preço.</p>
<div id="sellerProducts" class="grid"></div>
</div>
</section>
</main>

<div id="loginModal" class="modal hidden">
<div class="modalbox">
<h2>Entrar</h2>
<label>E-mail</label><input id="loginEmail" type="email" placeholder="seu e-mail">
<label>Senha</label><input id="loginPassword" type="password" placeholder="Sua senha">
<div id="loginError" class="error hidden" style="margin-top:10px"></div>
<div class="actions" style="margin-top:15px">
<button class="btn primary" onclick="login()">Entrar</button>
<button class="btn light" onclick="closeLogin()">Cancelar</button>
</div>
<p class="muted" style="font-size:12px;margin-top:14px">As contas de administrador e vendedor são criadas no Supabase.</p>
</div>
</div>

<script>
const SUPABASE_URL = "sb_publishable_8_TcKxlqD-70CCTvaLGkDg_CgVM9PCw";
const SUPABASE_KEY = "sb_publishable_8_TcKxlqD-70CCTvaLGkDg_CgVM9PCw";
const configured = !SUPABASE_URL.startsWith("COLE_") && !SUPABASE_KEY.startsWith("COLE_");
let sb = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
let currentUser=null, currentProfile=null, catalogRows=[], selectedFiles=[];

function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
function openLogin(){document.getElementById('loginModal').classList.remove('hidden');}
function closeLogin(){document.getElementById('loginModal').classList.add('hidden');}
function msgError(t){const e=document.getElementById('loginError');e.textContent=t;e.classList.remove('hidden');}
function clearError(){document.getElementById('loginError').classList.add('hidden');}

async function login(){
 clearError();
 if(!configured){msgError('Configure a URL e a chave do Supabase no index.html.');return;}
 const email=document.getElementById('loginEmail').value.trim();
 const password=document.getElementById('loginPassword').value;
 if(!email||!password){msgError('Informe e-mail e senha.');return;}
 const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){msgError('E-mail ou senha incorretos.');return;}
 currentUser=data.user;
 await loadProfile();
 closeLogin();
}

async function logout(){if(sb) await sb.auth.signOut();location.reload();}

async function loadProfile(){
 const {data,error}=await sb.from('profiles').select('id,email,full_name,role').eq('id',currentUser.id).single();
 if(error){alert('Perfil não encontrado. Crie o perfil conforme o passo a passo do LEIA-ME.');return;}
 currentProfile=data;
 document.getElementById('loginBtn').classList.add('hidden');
 document.getElementById('logoutBtn').classList.remove('hidden');
 document.getElementById('publicSection').classList.add('hidden');
 if(data.role==='admin') showAdmin();
 else if(data.role==='vendedor') showSeller();
 else alert('Usuário sem função definida.');
}

function showAdmin(){
 document.getElementById('adminSection').classList.remove('hidden');
 document.getElementById('userInfo').textContent=`Administrador: ${currentProfile.email}`;
 loadAdminProducts();
}
function showSeller(){
 document.getElementById('sellerSection').classList.remove('hidden');
 document.getElementById('sellerUserInfo').textContent=`Vendedor: ${currentProfile.full_name||currentProfile.email}`;
 const link=location.origin+location.pathname+'?vendedor='+currentProfile.id;
 document.getElementById('sellerLink').value=link;
 loadSellerProducts();
}
function showTab(tab){
 document.getElementById('productsTab').classList.toggle('hidden',tab!=='products');
 document.getElementById('addTab').classList.toggle('hidden',tab!=='add');
 document.getElementById('tabProducts').classList.toggle('active',tab==='products');
 document.getElementById('tabAdd').classList.toggle('active',tab==='add');
}

function previewPhotos(){
 const input=document.getElementById('pPhotos');
 selectedFiles=Array.from(input.files).slice(0,10);
 document.getElementById('photoPreview').innerHTML='';
 selectedFiles.forEach(f=>{
   const u=URL.createObjectURL(f);
   const im=document.createElement('img');im.src=u;document.getElementById('photoPreview').appendChild(im);
 });
 if(input.files.length>10) document.getElementById('saveMsg').innerHTML='<div class="notice">Somente as 10 primeiras fotos serão usadas.</div>';
}

async function uploadPhotos(productId){
 const urls=[];
 for(let i=0;i<selectedFiles.length;i++){
   const file=selectedFiles[i];
   const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
   const path=`${productId}/${crypto.randomUUID()}.${ext}`;
   const {error}=await sb.storage.from('product-images').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});
   if(error) throw new Error('Erro ao enviar foto: '+error.message);
   const {data}=sb.storage.from('product-images').getPublicUrl(path);
   urls.push(data.publicUrl);
 }
 return urls;
}

async function saveProduct(){
 const msg=document.getElementById('saveMsg');msg.innerHTML='';
 const model=document.getElementById('pModel').value.trim();
 const base=Number(document.getElementById('pBase').value);
 if(!model||!base||base<0){msg.innerHTML='<div class="error">Preencha modelo e preço-base.</div>';return;}
 const {data:p,error}=await sb.from('products').insert({
   model,os:document.getElementById('pOs').value,storage:document.getElementById('pStorage').value.trim(),
   color:document.getElementById('pColor').value.trim(),battery:document.getElementById('pBattery').value.trim(),
   condition:document.getElementById('pCondition').value,base_price:base,
   description:document.getElementById('pDescription').value.trim(),created_by:currentUser.id
 }).select('id').single();
 if(error){msg.innerHTML='<div class="error">'+esc(error.message)+'</div>';return;}
 try{
   const urls=await uploadPhotos(p.id);
   if(urls.length) await sb.from('products').update({photos:urls}).eq('id',p.id);
   msg.innerHTML='<div class="notice">Aparelho salvo corretamente.</div>';
   ['pModel','pStorage','pColor','pBattery','pBase','pDescription'].forEach(id=>document.getElementById(id).value='');
   document.getElementById('pPhotos').value='';selectedFiles=[];document.getElementById('photoPreview').innerHTML='';
   await loadAdminProducts();showTab('products');
 }catch(e){msg.innerHTML='<div class="error">'+esc(e.message)+'</div>';}
}

async function loadAdminProducts(){
 const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false});
 if(error){document.getElementById('adminProducts').innerHTML='<div class="error">'+esc(error.message)+'</div>';return;}
 document.getElementById('adminProducts').innerHTML=(data||[]).map(p=>`
 <div class="card"><img src="${esc((p.photos||[])[0]||'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22><rect width=%22100%%22 height=%22100%%22 fill=%22%23eee%22/></svg>')}">
 <div class="cardbody"><h3>${esc(p.model)}</h3><span class="badge">${p.os==='iphone'?'iPhone ':'Android 🤖'}</span><span class="badge">${esc(p.storage)}</span><p>${esc(p.color)} · ${esc(p.battery)}</p>
 <div class="price">${money(p.base_price)}</div><small class="muted">Preço-base privado</small></div></div>`).join('')||'<p>Nenhum aparelho cadastrado.</p>';
}

async function loadSellerProducts(){
 const {data,error}=await sb.from('seller_products').select('*').eq('seller_id',currentUser.id).order('model');
 if(error){document.getElementById('sellerProducts').innerHTML='<div class="error">'+esc(error.message)+'</div>';return;}
 document.getElementById('sellerProducts').innerHTML=(data||[]).map(p=>`
 <div class="card"><img src="${esc((p.photos||[])[0]||'')}"><div class="cardbody">
 <h3>${esc(p.model)}</h3><span class="badge">${p.os==='iphone'?'iPhone ':'Android 🤖'}</span><span class="badge">${esc(p.storage)}</span>
 <p>${esc(p.color)} · ${esc(p.battery)}</p>
 <p><strong>Seu preço de venda</strong></p>
 <input id="price_${p.id}" type="number" min="0" step="0.01" value="${p.sale_price??''}" placeholder="Ex.: 450">
 <label style="font-weight:400"><input id="active_${p.id}" type="checkbox" ${p.active?'checked':''} style="width:auto"> Aparecer no meu catálogo</label>
 <button class="btn green" onclick="saveSellerPrice('${p.id}')">Salvar preço</button>
 </div></div>`).join('')||'<p>Nenhum aparelho disponível.</p>';
}

async function saveSellerPrice(productId){
 const price=Number(document.getElementById('price_'+productId).value);
 const active=document.getElementById('active_'+productId).checked;
 if(!price||price<0){alert('Informe um preço de venda.');return;}
 const {error}=await sb.from('seller_prices').upsert({seller_id:currentUser.id,product_id:productId,sale_price:price,active},{onConflict:'seller_id,product_id'});
 if(error){alert(error.message);return;}
 alert('Preço salvo. Esse é o preço que o cliente verá no seu link.');
}

async function copySellerLink(){
 const el=document.getElementById('sellerLink');
 await navigator.clipboard.writeText(el.value);
 alert('Link copiado.');
}

async function loadPublicCatalog(){
 if(!configured){
   document.getElementById('catalog').innerHTML='<div class="error">O catálogo ainda não está configurado. Siga o LEIA-ME.txt.</div>';return;
 }
 const sellerId=new URLSearchParams(location.search).get('vendedor');
 if(!sellerId){
   document.getElementById('catalog').innerHTML='<div class="panel"><h2>CHRIS CELL</h2><p>Este é o catálogo público. Abra o link recebido do vendedor.</p></div>';return;
 }
 const {data,error}=await sb.rpc('catalogo_vendedor',{p_seller_id:sellerId});
 if(error){document.getElementById('catalog').innerHTML='<div class="error">Não foi possível carregar este catálogo.</div>';return;}
 catalogRows=data||[];
 document.getElementById('sellerInfo').textContent=catalogRows[0]?.seller_name?`Vendedor: ${catalogRows[0].seller_name}`:'';
 renderCatalog();
}
function renderCatalog(){
 const q=document.getElementById('search').value.toLowerCase();
 const os=document.getElementById('osFilter').value;
 const rows=catalogRows.filter(p=>(!q||[p.model,p.storage,p.color,p.condition].join(' ').toLowerCase().includes(q))&&(!os||p.os===os));
 document.getElementById('catalog').innerHTML=rows.map(p=>`
 <div class="card"><img src="${esc((p.photos||[])[0]||'')}"><div class="cardbody">
 <h3>${esc(p.model)}</h3><span class="badge">${p.os==='iphone'?'iPhone ':'Android 🤖'}</span><span class="badge">${esc(p.storage)}</span>
 <p>${esc(p.color)} · Bateria ${esc(p.battery)} · ${esc(p.condition)}</p>
 <div class="price">${money(p.sale_price)}</div>
 <button class="btn green" style="width:100%" onclick="interest('${encodeURIComponent(p.model+' '+(p.storage||''))}')">Tenho interesse</button>
 </div></div>`).join('')||'<div class="panel"><p>Nenhum aparelho disponível.</p></div>';
}
function interest(name){window.open('https://wa.me/?text='+encodeURIComponent('Olá! Tenho interesse no aparelho '+decodeURIComponent(name)+'.'),'_blank');}

async function boot(){
 if(!configured){loadPublicCatalog();return;}
 const {data:{session}}=await sb.auth.getSession();
 if(session){currentUser=session.user;await loadProfile();} else loadPublicCatalog();
 sb.auth.onAuthStateChange(async(_event,session)=>{if(session&&!currentProfile){currentUser=session.user;await loadProfile();}});
}
boot();
</script>
</body>
</html>
